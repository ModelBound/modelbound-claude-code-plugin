name: plugin-test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:e2e:full
        env:
          MODELBOUND_API_KEY: ${{ secrets.MODELBOUND_API_KEY }}
